<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">NotchShelf interaction concepts — not screenshots</title><desc id="desc">Four collapsed indicator concepts and examples of the tray and clipboard workflow. All sample data is fictional.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1425"/><stop offset="1" stop-color="#24213f"/></linearGradient><linearGradient id="land" x2="1" y2="1"><stop stop-color="#8bc0cd"/><stop offset="1" stop-color="#6853aa"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="0" y="0" width="1200" height="660" rx="24" fill="#111a2a" stroke="none"/><text x="44" y="49" fill="#f1f4fc" font-size="27" font-weight="600" text-anchor="start">Small when you need space. Ready when you need it.</text><text x="44" y="79" fill="#9db0cf" font-size="11" font-weight="600" text-anchor="start">CONCEPT EXAMPLES • NOT SCREENSHOTS • FICTIONAL CONTENT</text><rect x="44" y="111" width="263" height="152" rx="18" fill="#1c2940" stroke="#34445d"/><rect x="87" y="129" width="177" height="37" rx="12" fill="#04070b" stroke="none"/><text x="251" y="153" fill="#ebeffa" font-size="13" font-weight="600" text-anchor="end">64%</text><circle cx="105" cy="147" r="8" fill="#8baff0" stroke="none" stroke-width="1"/><rect x="121" y="129" width="78" height="28" rx="9" fill="#04070b" stroke="none"/><text x="62" y="204" fill="#e5edfb" font-size="17" font-weight="600" text-anchor="start">Downloads</text><text x="62" y="234" fill="#a9bad4" font-size="12" font-weight="400" text-anchor="start">Published progress or a spinner</text><rect x="327" y="111" width="263" height="152" rx="18" fill="#1c2940" stroke="#34445d"/><rect x="370" y="129" width="177" height="37" rx="12" fill="#04070b" stroke="none"/><text x="534" y="153" fill="#ebeffa" font-size="13" font-weight="600" text-anchor="end">18:42</text><circle cx="388" 