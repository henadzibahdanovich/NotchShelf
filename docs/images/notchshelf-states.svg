anchor="start">The tray</text><text x="66" y="389" fill="#a6b8d4" font-size="15" font-weight="400" text-anchor="start">A temporary stop between apps.</text><rect x="610" y="326" width="546" height="262" rx="20" fill="#1c2940" stroke="#34445d"/><text x="632" y="363" fill="#eaf0fa" font-size="23" font-weight="600" text-anchor="start">Clipboard history</text><text x="632" y="389" fill="#a6b8d4" font-size="15" font-weight="400" text-anchor="start">Copy once. Reach for it again.</text><rect x="68" y="413" width="225" height="111" rx="14" fill="#233751" stroke="#6481a7"/><text x="180" y="450" fill="#a2c1f2" font-size="12" font-weight="600" text-anchor="middle">DROP</text><text x="180" y="478" fill="#e7effa" font-size="13" font-weight="500" text-anchor="middle">File · Link · Image · Text</text><text x="180" y="503" fill="#a9bfdc" font-size="11" font-weight="400" text-anchor="middle">Keep it nearby</text><path d="M307 469 L328 469" stroke="#a2b9dc" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M319 460 L328 469" stroke="#a2b9dc" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M319 478 L328 469" stroke="#a2b9dc" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="344" y="413" width="222" height="111" rx="14" fill="#233751" stroke="none"/><text x="455" y="454" fill="#a2c1f2" font-size="12" font-weight="600" text-anchor="middle">DRAG INTO AN APP</text><text x="455" y="480" fill="#e7effa" font-size="14" font-weight="500" text-anchor="middle">Continue your work</text><text x="68" y="562" fill="#a9bad4" font-size="12" font-weight="400" text-anchor="start">Original dropped files stay in their existing locations.</text><rect x="634" y="413" width="236" height="111" rx="14" fill="#233751" stroke="none"/><text x="650" y="440" fill="#e7effa" font-size="14" font-weight="600" text-anchor="start">Example note</text><text x="650" y="465" fill="#b2c3dd" font-size="12" font-weight="400" text-anchor="start">A useful sentence to reuse.</text><text x="65