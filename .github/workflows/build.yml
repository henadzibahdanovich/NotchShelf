name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Check shell syntax
        run: bash -n install.sh uninstall.sh
      - name: Build and package without launching
        run: ./install.sh --build-only
      - name: Verify app bundle
        run: |
          plutil -lint build/NotchShelf.app/Contents/Info.plist
          codesign --verify --strict build/NotchShelf.app
